{% set version = "2.56.1" %}
# Git for Windows tags releases v<version>.windows.<win_build>. Its file names
# only carry the 4th number when win_build > 1 (e.g. 2.56.0.4, but 2.56.1).
{% set win_build = "1" %}
{% set win_version = version if win_build == "1" else version ~ "." ~ win_build %}
{% set name = "git" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-{{ version }}.tar.gz  # [not win]
    folder: code  # [not win]
    sha256: fd0c0495427dc9ac445fdced8e36bb5eb6f233a14da5db3c6dfd8dcfa7f85761  # [not win]
    patches:   # [not win]
      - 0001-macOS-Do-not-use-the-system-Wish-urgh.patch  # [not win]
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-manpages-{{ version }}.tar.gz  # [not win]
    folder: manpages  # [not win]
    sha256: 5cdf9bf4c83f4679f52d83f9bf19aa71918927acc3e3a9c02fe5ee271b2d62e4  # [not win]
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-htmldocs-{{ version }}.tar.gz  # [not win]
    folder: htmldocs  # [not win]
    sha256: 49d0b031395e1d8823c30881d565841aed2289a9cb0e03aba9571bb1fc90d9ae  # [not win]

  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_build }}/PortableGit-{{ win_version }}-64-bit.7z.exe  # [win64]
    folder: .  # [win64]
    sha256: 9dd04a608ceb5f6ab32a73709e0ecb159d211da71b697c45ff81f6dd0c6b49c7  # [win64]
  # Use this dummy source to tell our Windows signing process which binaries to skip. This is not actually used in the build.
  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_build }}/Git-{{ win_version }}-64-bit.tar.bz2  # [win64]
    folder: git-64-bit  # [win64]
    sha256: d7d89e69855f00e73d957b513c49538a420c465c84b9d212cf1add400eecdf54  # [win64]

  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_build }}/PortableGit-{{ win_version }}-arm64.7z.exe  # [win and arm64]
    folder: .  # [win and arm64]
    sha256: 0dca0d9f760924a7e6752235d7dd6eb1a9b508ee714b6ed15d89252e5a58c5c9  # [win and arm64]
  # Use this dummy source to tell our Windows signing process which binaries to skip. This is not actually used in the build.
  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_build }}/Git-{{ win_version }}-arm64.tar.bz2  # [win and arm64]
    folder: git-arm64  # [win and arm64]
    sha256: 4a5e1555ac8453033d504930857ec8ba4eef20275d784b4e71df84a3da071afb  # [win and arm64]


build:
  number: 0
  # git hardcodes paths to external utilities (e.g. curl)
  detect_binary_files_with_prefix: true
  missing_dso_whitelist: # [win]
    - '*'                # [win]
  no_link:
    - 'Menu/{{ name }}_menu.json'
  script_env:                       # [win]
    - WIN_FILE_VERSION={{ win_version }} # [win]

requirements:
  build:
    - {{ stdlib('c') }}    # [unix]
    - {{ compiler('c') }}  # [unix]
    - autoconf             # [unix]
    - make                 # [unix]
  host:
    # https://github.com/git/git/blob/v2.56.1/INSTALL
    - gettext {{ gettext }}    # [unix]
    - libcurl {{ libcurl }}    # [unix]
    - expat {{ expat }}        # [unix]
    - libiconv {{ libiconv }}  # [unix]
    - openssl {{ openssl }}    # [unix]
    - pcre2 {{ pcre2 }}        # [unix]
    - perl {{ perl }}          # [unix]
    - tk {{ tk }}              # [unix]
    - zlib {{ zlib }}          # [unix]
  run:
    - perl {{ perl.split(".")[0] }}.*  # [unix]
    # exact pin handled through run_exports
    - gettext   # [unix]
    - libcurl   # [unix]
    - expat     # [unix]
    - libiconv  # [unix]
    - openssl   # [unix]
    - pcre2     # [unix]
    - tk        # [unix]
    - zlib      # [unix]

test:
  commands:
    # Verify git location.
    - test -f $PREFIX/bin/git                               # [unix]
    - test -f $PREFIX/bin/gitk                              # [unix]
    - test -f $PREFIX/bin/git-credential-osxkeychain        # [osx]
    - if not exist %LIBRARY_PREFIX%\\bin\\git.exe exit 1    # [win]

    # Run git commands.
    - git --version
    - git clone https://github.com/conda-forge/git-feedstock --depth 1

    # Git credential commands
    - git-credential-osxkeychain 2>&1 | grep -q usage  # [osx]

    # test completions
    - bash $PREFIX/share/bash-completion/completions/git  # [unix]

    # confirm toplevel manpage
    - test -f $PREFIX/man/man1/git.1  # [not win]
    - test -f $PREFIX/share/man/man1/git.1  # [osx]

    # confirm toplevel html doc page
    - test -f $PREFIX/share/doc/git/index.html  # [not win]

about:
  home: https://git-scm.com/
  description: |
    Git is a distributed version control system that tracks changes in any set of computer files,
    usually used for coordinating work among programmers collaboratively developing source code during software development.
  # unix (built from source): git is GPL v2 exactly, vendored subtree (contrib/subtree)
  # is GPL v2 or later, other vendored software (xdiff, compat/regex, obstack) is LGPL-2.1 or later.
  # win (PortableGit repack): git plus bundled MSYS2/MinGW components; see THIRD-PARTY-LICENSES.txt,
  # generated by recipe/collect-licenses.bat.
  license: GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later  # [not win]
  license: GPL-2.0-only AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1 AND MIT AND BSD-2-Clause AND BSD-3-Clause AND Apache-2.0 AND MPL-2.0 AND Zlib AND curl AND ISC AND Vim AND TCL AND Artistic-1.0-Perl  # [win]
  license_file:
    - COPYING
    - code/LGPL-2.1                 # [not win]
    - code/contrib/subtree/COPYING  # [not win]
    - THIRD-PARTY-LICENSES.txt      # [win]
  license_family: GPL     # [not win]
  license_family: OTHER   # [win]
  summary: distributed version control system
  dev_url: https://github.com/git/git
  doc_url: https://git-scm.com/docs

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - scopatz
    - ocefpaf
    - djsutherland
