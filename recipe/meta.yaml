{% set version = "2.56.0" %}
{% set win_version = "4" %}
{% set name = "git" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-{{ version }}.tar.gz  # [not win]
    folder: code  # [not win]
    sha256: 826817fd3671b8565586d6d49f688298de8354ab11db829c02720e5c74b9b39f  # [not win]
    patches:   # [not win]
      - 0001-macOS-Do-not-use-the-system-Wish-urgh.patch  # [not win]
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-manpages-{{ version }}.tar.gz  # [not win]
    folder: manpages  # [not win]
    sha256: be5ced6a6333baa36ecd4c1575bcf66aee9b04444b918115ff87bf65cd6d61b4  # [not win]
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-htmldocs-{{ version }}.tar.gz  # [not win]
    folder: htmldocs  # [not win]
    sha256: 62b477a75a997fa16532c4d44e26a6a47a512ad7086116d912bb2ab16c785bc3  # [not win]

  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_version }}/PortableGit-{{ version }}.{{ win_version }}-64-bit.7z.exe  # [win64]
    folder: .  # [win64]
    sha256: b1f3e52216e2ed6882d1bebfd4d3fdf319bec40d2edbbf9fd26ec4fd3fce7ed1  # [win64]
  # Use this dummy source to tell our Windows signing process which binaries to skip. This is not actually used in the build.
  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_version }}/Git-{{ version }}.{{ win_version }}-64-bit.tar.bz2  # [win64]
    folder: git-64-bit  # [win64]
    sha256: e7dcc4adbb0eb373064598cd18bc75e60128707d816ead51cd9bd98e356f0075  # [win64]

  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_version }}/PortableGit-{{ version }}.{{ win_version }}-arm64.7z.exe  # [win and arm64]
    folder: .  # [win and arm64]
    sha256: 044110f9d951858452ddb5e4b5415ea0f2b5b2598e794d6fec77fe28b9aa8cc0  # [win and arm64]
  # Use this dummy source to tell our Windows signing process which binaries to skip. This is not actually used in the build.
  - url: https://github.com/git-for-windows/git/releases/download/v{{ version }}.windows.{{ win_version }}/Git-{{ version }}.{{ win_version }}-arm64.tar.bz2  # [win and arm64]
    folder: git-arm64  # [win and arm64]
    sha256: e7dcc4adbb0eb373064598cd18bc75e60128707d816ead51cd9bd98e356f0075  # [win and arm64]


build:
  number: 0
  # git hardcodes paths to external utilities (e.g. curl)
  detect_binary_files_with_prefix: true
  missing_dso_whitelist: # [win]
    - '*'                # [win]
  no_link:
    - 'Menu/{{ name }}_menu.json'
  script_env:                       # [win]
    - WIN_VERSION={{ win_version }} # [win]

requirements:
  build:
    - {{ stdlib('c') }}    # [unix]
    - {{ compiler('c') }}  # [unix]
    - autoconf             # [unix]
    - make                 # [unix]
  host:
    # https://github.com/git/git/blob/v2.56.0/INSTALL#L110
    - gettext {{ gettext }}    # [unix]
    - libcurl {{ libcurl }}    # [unix]
    - expat {{ expat }}        # [unix]
    - libiconv {{ libiconv }}  # [unix]
    - openssl {{ openssl }}    # [unix]
    - pcre2 {{ pcre2 }}        # [unix]
    - perl {{ perl }}          # [unix]
    - tk {{ tk }}              # [unix]
    - zlib {{ zlib }}          # [unix]
  run:
    - perl {{ perl.split(".")[0] }}.*  # [unix]
    # exact pin handled through run_exports
    - gettext   # [unix]
    - libcurl   # [unix]
    - expat     # [unix]
    - libiconv  # [unix]
    - openssl   # [unix]
    - pcre2     # [unix]
    - tk        # [unix]
    - zlib      # [unix]

test:
  commands:
    # Verify git location.
    - test -f $PREFIX/bin/git                               # [unix]
    - test -f $PREFIX/bin/gitk                              # [unix]
    - test -f $PREFIX/bin/git-credential-osxkeychain        # [osx]
    - if not exist %LIBRARY_PREFIX%\\bin\\git.exe exit 1    # [win]

    # Run git commands.
    - git --version
    - git clone https://github.com/conda-forge/git-feedstock

    # Git credential commands
    - git-credential-osxkeychain 2>&1 | grep -q usage  # [osx]

    # test completions
    - bash $PREFIX/share/bash-completion/completions/git  # [unix]

    # confirm toplevel manpage
    - test -f $PREFIX/man/man1/git.1  # [not win]
    - test -f $PREFIX/share/man/man1/git.1  # [osx]

    # confirm toplevel html doc page
    - test -f $PREFIX/share/doc/git/index.html  # [not win]

about:
  home: https://git-scm.com/
  description: |
    Git is a distributed version control system that tracks changes in any set of computer files,
    usually used for coordinating work among programmers collaboratively developing source code during software development.
  license: GPL-2.0-or-later and LGPL-2.1-or-later
  license_file: COPYING
  license_family: OTHER
  summary: distributed version control system
  dev_url: https://github.com/git/git
  doc_url: https://git-scm.com/docs

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - scopatz
    - ocefpaf
    - djsutherland
